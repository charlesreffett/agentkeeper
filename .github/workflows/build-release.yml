name: Build Production Release

on:
  workflow_call:
    inputs:
      tag_name:
        description: Release tag created by Release Please
        required: true
        type: string
      ref:
        description: Exact tag or commit to package
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing GitHub release tag
        required: true
        type: string
      ref:
        description: Exact tag or commit to package
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-release-${{ inputs.tag_name }}
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Hold release as a draft while artifacts build
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: gh release edit "$RELEASE_TAG" --repo "${{ github.repository }}" --draft

  build-mac:
    needs: prepare-release
    runs-on: macos-15
    timeout-minutes: 45
    environment: production-signing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Require macOS signing credentials
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          MAC_APPLE_API_KEY: ${{ secrets.MAC_APPLE_API_KEY }}
          MAC_APPLE_API_KEY_ID: ${{ secrets.MAC_APPLE_API_KEY_ID }}
          MAC_APPLE_API_ISSUER: ${{ secrets.MAC_APPLE_API_ISSUER }}
          MAC_APPLE_TEAM_ID: ${{ vars.MAC_APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD MAC_APPLE_API_KEY MAC_APPLE_API_KEY_ID MAC_APPLE_API_ISSUER MAC_APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing production-signing value: $name" >&2
              exit 1
            fi
          done

      - name: Materialize App Store Connect API key
        id: apple-key
        shell: bash
        env:
          API_KEY: ${{ secrets.MAC_APPLE_API_KEY }}
          API_KEY_ID: ${{ secrets.MAC_APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
          printf '%s' "$API_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "path=$key_path" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, sign, and notarize macOS artifacts
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ steps.apple-key.outputs.path }}
          APPLE_API_KEY_ID: ${{ secrets.MAC_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.MAC_APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.MAC_APPLE_TEAM_ID }}
        run: |
          pnpm build
          pnpm --filter desktop exec electron-builder --config electron-builder.production.yml --mac --publish never -c.forceCodeSigning=true

      - name: Verify macOS signatures and notarization
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' app_path; do
            found=1
            codesign --verify --deep --strict --verbose=2 "$app_path"
            spctl --assess --type execute --verbose=4 "$app_path"
            xcrun stapler validate "$app_path"
          done < <(find apps/desktop/dist -type d -name 'AgentKeeper.app' -print0)
          [[ "$found" == 1 ]] || { echo 'No packaged AgentKeeper.app found' >&2; exit 1; }

      - name: Upload macOS release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/latest-mac.yml
            apps/desktop/dist/*.blockmap
          if-no-files-found: error
          retention-days: 1

  build-win:
    needs: prepare-release
    runs-on: windows-latest
    timeout-minutes: 45
    environment: production-signing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Require Windows signing credentials
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK)) { throw "WIN_CSC_LINK is missing" }
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)) { throw "WIN_CSC_KEY_PASSWORD is missing" }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and sign Windows artifacts
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          pnpm build
          pnpm --filter desktop exec electron-builder --config electron-builder.production.yml --win --publish never -c.forceCodeSigning=true

      - name: Verify Windows signatures
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem "apps/desktop/dist" -Filter "*.exe")
          if ($installers.Count -eq 0) { throw "No Windows installer was generated" }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature $installer.FullName
            Write-Host "$($installer.Name): $($signature.Status) — $($signature.SignerCertificate.Subject)"
            if ($signature.Status -ne "Valid") { throw "Invalid signature: $($installer.FullName)" }
          }

      - name: Upload Windows release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/latest.yml
            apps/desktop/dist/*.blockmap
          if-no-files-found: error
          retention-days: 1

  publish-release:
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Upload assets and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" release-assets/* --repo "${{ github.repository }}" --clobber
          gh release edit "$RELEASE_TAG" --repo "${{ github.repository }}" --draft=false --latest
