name: Publish Plugin

on:
  workflow_call:
    inputs:
      plugin_id:
        required: true
        type: string
      plugin_dir:
        required: true
        type: string
      tag_name:
        required: true
        type: string
      feed_tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag_name }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build and pack plugin
        env:
          PLUGIN_DIR: ${{ inputs.plugin_dir }}
        run: |
          set -euo pipefail
          pnpm --filter @agentkeeper/cli build
          pnpm --filter "./${PLUGIN_DIR}" build
          pnpm --filter @agentkeeper/cli exec node dist/cli.cjs pack --dir "../../${PLUGIN_DIR}"

      - name: Create update feed
        id: artifact
        env:
          GH_REPOSITORY: ${{ github.repository }}
          PLUGIN_ID: ${{ inputs.plugin_id }}
          PLUGIN_DIR: ${{ inputs.plugin_dir }}
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./${PLUGIN_DIR}/package.json').version")"
          archive="${PLUGIN_ID}-${version}.akp"
          archive_path="${PLUGIN_DIR}/${archive}"
          sha256="$(sha256sum "$archive_path" | cut -d' ' -f1)"
          feed="${PLUGIN_ID}-update-manifest.json"
          PLUGIN_VERSION="$version" ARCHIVE="$archive" SHA256="$sha256" FEED="$feed" node -e '
            const fs = require("node:fs")
            const data = {
              id: process.env.PLUGIN_ID,
              releases: [{
                version: process.env.PLUGIN_VERSION,
                url: `https://github.com/${process.env.GH_REPOSITORY}/releases/download/${process.env.RELEASE_TAG}/${process.env.ARCHIVE}`,
                sha256: process.env.SHA256,
              }],
            }
            fs.writeFileSync(process.env.FEED, JSON.stringify(data, null, 2) + "\n")
          '
          echo "archive_path=$archive_path" >> "$GITHUB_OUTPUT"
          echo "feed=$feed" >> "$GITHUB_OUTPUT"

      - name: Upload versioned package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag_name }}
          ARCHIVE_PATH: ${{ steps.artifact.outputs.archive_path }}
          FEED: ${{ steps.artifact.outputs.feed }}
        run: gh release upload "$RELEASE_TAG" "$ARCHIVE_PATH" "$FEED" --repo "${{ github.repository }}" --clobber

      - name: Publish stable update feed
        env:
          GH_TOKEN: ${{ github.token }}
          FEED_TAG: ${{ inputs.feed_tag }}
          FEED: ${{ steps.artifact.outputs.feed }}
          PLUGIN_ID: ${{ inputs.plugin_id }}
        run: |
          set -euo pipefail
          if ! gh release view "$FEED_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$FEED_TAG" --repo "${{ github.repository }}" --title "$PLUGIN_ID plugin update feed" --notes "Machine-readable AgentKeeper plugin update feed."
          fi
          gh release upload "$FEED_TAG" "$FEED" --repo "${{ github.repository }}" --clobber
