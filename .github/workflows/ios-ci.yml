name: iOS CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS simulator app
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build without code signing
        run: |
          set -o pipefail
          xcodebuild \
            -project apps/ios/AgentKeeperCompanion/AgentKeeperCompanion.xcodeproj \
            -scheme AgentKeeperCompanion \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/AgentKeeperCompanion-DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
