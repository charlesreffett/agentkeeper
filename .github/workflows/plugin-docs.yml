name: Plugin documentation

on:
  pull_request:
    paths:
      - 'docs/plugin-author/**'
      - 'packages/sdk/**'
      - 'scripts/verify-plugin-docs.mjs'
      - '.github/workflows/plugin-docs.yml'
  push:
    branches: [main]
    paths:
      - 'docs/plugin-author/**'
      - 'packages/sdk/**'
      - 'scripts/verify-plugin-docs.mjs'
      - '.github/workflows/plugin-docs.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/verify-plugin-docs.mjs
      - run: pnpm verify:plugin-packages
