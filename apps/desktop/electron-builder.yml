appId: com.agentkeeper.desktop
productName: AgentKeeper
copyright: Copyright © 2024

directories:
  buildResources: build
  output: dist

# electron-vite bundles all JS (including workspace packages) into out/.
# node_modules is still needed at runtime for native addons (better-sqlite3,
# keytar) and any externalized deps that couldn't be bundled.
files:
  - out/**
  - node_modules/**
  - package.json
  - "!node_modules/.cache/**"
  - "!node_modules/@agentkeeper/**"
  # AgentKeeper invokes the user's installed Claude Code CLI. The Agent SDK's
  # optional native CLI is ~236 MB per architecture and duplicates it.
  - "!node_modules/@anthropic-ai/claude-agent-sdk-*/**"
  - "!**/*.map"

# .node files must live outside the asar archive so Electron can dlopen them.
asarUnpack:
  - "**/*.node"

# Chromium ships dozens of locale packs by default. The UI currently has no
# locale switching, so retain English only.
electronLanguages:
  - en-US

npmRebuild: true

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.developer-tools
  # Production signing is layered on by electron-builder.production.yml.
  hardenedRuntime: false
  gatekeeperAssess: false
  icon: build/AppIcon.icon

dmg:
  sign: false
  icon: build/icon.icns

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
